<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>스타가디언즈: 다크가디언즈의 습격</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#090b1a;font-family:system-ui,-apple-system,sans-serif}#wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}.title{color:#fff;font-weight:900;font-size:18px;text-shadow:0 0 10px #7dd3fc}canvas{width:min(96vw,960px);height:auto;max-height:72vh;border:3px solid white;border-radius:14px;background:#10163a;image-rendering:pixelated}.controls{display:flex;gap:8px;touch-action:none;flex-wrap:wrap;justify-content:center}button{border:0;border-radius:14px;min-width:58px;height:54px;padding:0 14px;font-size:22px;font-weight:900;background:#f8fafc;box-shadow:0 4px 0 #64748b}button:active{transform:translateY(3px);box-shadow:0 1px 0 #64748b}.jump{background:#fde68a}.attack{background:#fca5a5}.switch{background:#c4b5fd;font-size:16px}.hint{color:#dbeafe;font-size:12px;font-weight:700}</style></head><body><div id="wrap"><div class="title">⭐ 스타가디언즈: 다크가디언즈의 습격 ⭐</div><div class="hint">스타코어 5개를 모으고 다크캅스스타를 물리쳐!</div><canvas id="game" width="960" height="540"></canvas><div class="controls"><button id="left">◀</button><button id="right">▶</button><button id="jump" class="jump">점프</button><button id="attack" class="attack">공격</button><button id="switch" class="switch">영웅 교체</button></div></div><script>const c=document.getElementById('game'),x=c.getContext('2d');const K={};let cam=0,won=false,over=false,tick=0;const heroes=[{name:'파이어스타',color:'#ef4444',atk:'#fb923c',skill:'파이어 블래스트'},{name:'아이스스타',color:'#38bdf8',atk:'#bae6fd',skill:'아이스 샷'},{name:'썬더스타',color:'#facc15',atk:'#fde047',skill:'썬더 볼트'},{name:'화이트핑크',color:'#f9a8d4',atk:'#fbcfe8',skill:'힐링 스타'},{name:'블래이드스타',color:'#6366f1',atk:'#c7d2fe',skill:'스타 슬래시'}];let hi=0;const P={x:80,y:380,w:44,h:64,vx:0,vy:0,ground:false,hp:5,cores:0,inv:0,face:1,cool:0};const plats=[{x:0,y:470,w:620,h:70},{x:710,y:470,w:520,h:70},{x:1320,y:470,w:520,h:70},{x:1920,y:470,w:510,h:70},{x:2520,y:470,w:680,h:70},{x:250,y:385,w:170,h:22},{x:790,y:350,w:150,h:22},{x:1080,y:285,w:150,h:22},{x:1420,y:390,w:170,h:22},{x:1700,y:320,w:160,h:22},{x:2050,y:365,w:180,h:22},{x:2360,y:300,w:160,h:22},{x:2740,y:385,w:180,h:22}];const cores=[{x:335,y:330,t:0},{x:865,y:295,t:0},{x:1155,y:230,t:0},{x:1780,y:265,t:0},{x:2440,y:245,t:0}];const enemies=[{x:500,y:430,w:48,h:40,v:1.4,a:470,b:590,hp:2},{x:910,y:430,w:48,h:40,v:1.6,a:760,b:1170,hp:2},{x:1510,y:430,w:48,h:40,v:1.7,a:1350,b:1780,hp:2},{x:2180,y:430,w:48,h:40,v:1.9,a:1970,b:2380,hp:3},{x:2780,y:430,w:48,h:40,v:2,a:2600,b:2960,hp:3}];const boss={x:3050,y:360,w:90,h:110,hp:15,max:15,alive:true,v:1.4,a:2940,b:3120};let shots=[];function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function reset(){P.x=80;P.y=380;P.vx=P.vy=0;P.hp=5;P.cores=0;P.inv=0;cores.forEach(q=>q.t=0);enemies.forEach((e,i)=>{e.hp=i<3?2:3});boss.hp=boss.max;boss.alive=true;shots=[];won=over=false;hi=0}function jump(){if(P.ground&&!won&&!over){P.vy=-15;P.ground=false}else if(won||over)reset()}function attack(){if(won||over){reset();return}if(P.cool>0)return;P.cool=22;const h=heroes[hi];if(hi===3&&P.hp<5){P.hp++;return}shots.push({x:P.face>0?P.x+P.w:P.x-18,y:P.y+28,w:22,h:10,v:12*P.face,color:h.atk,life:70,pow:hi===4?2:1})}function bind(id,key){const e=document.getElementById(id);e.onpointerdown=a=>{a.preventDefault();K[key]=1};['pointerup','pointercancel','pointerleave'].forEach(n=>e.addEventListener(n,a=>{a.preventDefault();K[key]=0}))}bind('left','L');bind('right','R');document.getElementById('jump').onpointerdown=e=>{e.preventDefault();jump()};document.getElementById('attack').onpointerdown=e=>{e.preventDefault();attack()};document.getElementById('switch').onpointerdown=e=>{e.preventDefault();hi=(hi+1)%heroes.length};addEventListener('keydown',e=>{if(e.key==='ArrowLeft')K.L=1;if(e.key==='ArrowRight')K.R=1;if(e.key===' ')jump();if(e.key==='x')attack();if(e.key==='c')hi=(hi+1)%heroes.length});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')K.L=0;if(e.key==='ArrowRight')K.R=0});function damage(){if(P.inv>0)return;P.hp--;P.inv=90;P.vy=-8;P.vx=-7*P.face;if(P.hp<=0)over=true}function update(){tick++;if(won||over)return;if(K.L){P.vx-=.8;P.face=-1}if(K.R){P.vx+=.8;P.face=1}P.vx*=.84;P.vx=Math.max(-7,Math.min(7,P.vx));P.vy+=.75;P.x+=P.vx;P.y+=P.vy;P.ground=false;for(const p of plats){if(P.x+P.w>p.x&&P.x<p.x+p.w&&P.y+P.h>=p.y&&P.y+P.h<=p.y+24&&P.vy>=0){P.y=p.y-P.h;P.vy=0;P.ground=true}}if(P.y>620){damage();P.x=Math.max(30,P.x-180);P.y=300}P.x=Math.max(0,Math.min(3180-P.w,P.x));if(P.inv>0)P.inv--;if(P.cool>0)P.cool--;for(const q of cores){if(!q.t&&Math.hypot(P.x+P.w/2-q.x,P.y+P.h/2-q.y)<38){q.t=1;P.cores++}}for(const e of enemies){if(e.hp<=0)continue;e.x+=e.v;if(e.x<e.a||e.x>e.b)e.v*=-1;if(hit(P,e))damage()}if(boss.alive){boss.x+=boss.v;if(boss.x<boss.a||boss.x>boss.b)boss.v*=-1;if(hit(P,boss))damage()}for(const s of shots){s.x+=s.v;s.life--;for(const e of enemies){if(e.hp>0&&hit(s,e)){e.hp-=s.pow;s.life=0}}if(boss.alive&&hit(s,boss)){boss.hp-=s.pow;s.life=0;if(boss.hp<=0)boss.alive=false}}shots=shots.filter(s=>s.life>0);if(P.cores===5&&!boss.alive&&P.x>3030)won=true;cam=Math.max(0,Math.min(2240,P.x-300))}function star(cx,cy,r,col){x.save();x.translate(cx,cy);x.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2? r*.45:r;x.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}x.closePath();x.fillStyle=col;x.fill();x.restore()}function robot(px,py,col){x.fillStyle=col;x.fillRect(px+8,py+18,28,38);x.fillRect(px+4,py+55,14,22);x.fillRect(px+26,py+55,14,22);x.fillRect(px,py+24,9,28);x.fillRect(px+35,py+24,9,28);x.fillStyle='#e2e8f0';x.fillRect(px+10,py,24,22);x.fillStyle='#111827';x.fillRect(px+14,py+8,5,4);x.fillRect(px+25,py+8,5,4);star(px+22,py+37,8,'#fff')}function draw(){x.clearRect(0,0,c.width,c.height);const g=x.createLinearGradient(0,0,0,540);g.addColorStop(0,'#11143c');g.addColorStop(1,'#4c1d95');x.fillStyle=g;x.fillRect(0,0,960,540);x.fillStyle='white';for(let i=0;i<90;i++){const sx=(i*137-cam*.2)%1200,sy=(i*73)%330;x.globalAlpha=.35+((i%5)/8);x.fillRect(sx,sy,2+(i%3),2+(i%3))}x.globalAlpha=1;x.save();x.translate(-cam,0);x.fillStyle='#312e81';for(let i=0;i<14;i++){x.fillRect(i*250,250+(i%3)*45,190,220);x.fillStyle='#fef08a';for(let w=0;w<4;w++)x.fillRect(i*250+25+w*38,280+(w%2)*30,14,24);x.fillStyle='#312e81'}for(const p of plats){x.fillStyle='#334155';x.fillRect(p.x,p.y,p.w,p.h);x.fillStyle='#60a5fa';x.fillRect(p.x,p.y,p.w,10)}for(const q of cores)if(!q.t){star(q.x,q.y,18,'#fde047');x.strokeStyle='#fff';x.strokeRect(q.x-24,q.y-24,48,48)}for(const e of enemies)if(e.hp>0){robot(e.x,e.y-20,'#111827');x.fillStyle='#ef4444';x.fillRect(e.x+8,e.y-26,28,5)}if(boss.alive){robot(boss.x,boss.y,'#0f172a');x.save();x.translate(boss.x+45,boss.y+50);x.scale(1.7,1.7);x.translate(-22,-38);robot(0,0,'#020617');x.restore();x.fillStyle='#dc2626';x.fillRect(boss.x,boss.y-18,boss.w,10);x.fillStyle='#22c55e';x.fillRect(boss.x,boss.y-18,boss.w*(boss.hp/boss.max),10)}for(const s of shots){x.fillStyle=s.color;x.fillRect(s.x,s.y,s.w,s.h);star(s.x+s.w/2,s.y+5,7,s.color)}if(P.inv%10<5)robot(P.x,P.y,heroes[hi].color);x.restore();x.fillStyle='rgba(3,7,18,.85)';x.fillRect(16,14,470,74);x.fillStyle='white';x.font='bold 22px system-ui';x.fillText('❤️ '+P.hp+'   ⭐ 코어 '+P.cores+'/5',30,43);x.font='bold 18px system-ui';x.fillStyle=heroes[hi].color;x.fillText(heroes[hi].name+' · '+heroes[hi].skill,30,72);if(P.cores<5&&P.x>2850){x.fillStyle='rgba(0,0,0,.7)';x.fillRect(560,100,360,48);x.fillStyle='white';x.font='bold 19px system-ui';x.fillText('스타코어를 모두 모아야 해!',585,130)}if(!boss.alive&&P.cores===5){x.fillStyle='rgba(15,23,42,.8)';x.fillRect(600,100,310,48);x.fillStyle='#fde047';x.fillText('오른쪽 끝으로 이동!',665,130)}if(won||over){x.fillStyle='rgba(0,0,0,.72)';x.fillRect(0,0,960,540);x.textAlign='center';x.fillStyle='white';x.font='bold 52px system-ui';x.fillText(won?'스타시티를 지켰다!':'스타파워 소진!',480,230);x.font='bold 24px system-ui';x.fillStyle=won?'#fde047':'#fca5a5';x.fillText(won?'스타가디언즈 승리!':'다시 출동하자!',480,280);x.fillStyle='white';x.font='20px system-ui';x.fillText('점프 또는 공격 버튼을 누르면 다시 시작',480,330);x.textAlign='left'}}function loop(){update();draw();requestAnimationFrame(loop)}loop();</script></body></html>
