<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
<title>어드벤처 월드</title>
<style>
  html,body{margin:0;height:100%;background:#101827;font-family:system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
  #wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
  canvas{background:linear-gradient(#7dd3fc,#e0f2fe);border:3px solid #fff;border-radius:12px;max-width:96vw;max-height:72vh;image-rendering:pixelated}
  .info{color:white;font-weight:700;text-align:center;font-size:14px}
  .controls{display:flex;gap:12px;align-items:center;justify-content:center;touch-action:none}
  button{width:64px;height:56px;border:0;border-radius:14px;font-size:28px;font-weight:900;background:#f8fafc;box-shadow:0 4px 0 #94a3b8}
  button:active{transform:translateY(3px);box-shadow:0 1px 0 #94a3b8}
  #jump{width:92px;background:#fde68a}
</style>
</head>
<body>
<div id="wrap">
  <div class="info">← → 이동 · 스페이스 점프 · 별 5개를 모아 깃발까지 가자!</div>
  <canvas id="game" width="960" height="540"></canvas>
  <div class="controls">
    <button id="left">◀</button>
    <button id="right">▶</button>
    <button id="jump">점프</button>
  </div>
</div>
<script>
const canvas=document.getElementById('game');const ctx=canvas.getContext('2d');const keys={};let gameWon=false,gameOver=false,cameraX=0;const world={width:3200,groundY:470};const player={x:80,y:380,w:42,h:58,vx:0,vy:0,speed:.75,maxSpeed:7,jump:15,onGround:false,hearts:3,stars:0,invincible:0};const platforms=[{x:0,y:470,w:650,h:70},{x:740,y:470,w:520,h:70},{x:1350,y:470,w:500,h:70},{x:1940,y:470,w:550,h:70},{x:2600,y:470,w:600,h:70},{x:280,y:385,w:160,h:24},{x:820,y:360,w:150,h:24},{x:1080,y:295,w:150,h:24},{x:1430,y:390,w:180,h:24},{x:1710,y:320,w:150,h:24},{x:2080,y:365,w:180,h:24},{x:2380,y:300,w:160,h:24},{x:2730,y:390,w:150,h:24}];const stars=[{x:360,y:335,r:14,taken:false},{x:900,y:310,r:14,taken:false},{x:1155,y:245,r:14,taken:false},{x:1790,y:270,r:14,taken:false},{x:2460,y:250,r:14,taken:false}];const enemies=[{x:520,y:432,w:48,h:38,vx:1.3,min:500,max:620,alive:true},{x:900,y:432,w:48,h:38,vx:1.5,min:800,max:1180,alive:true},{x:1510,y:432,w:48,h:38,vx:1.6,min:1380,max:1780,alive:true},{x:2200,y:432,w:48,h:38,vx:1.8,min:1980,max:2440,alive:true},{x:2820,y:432,w:48,h:38,vx:2,min:2650,max:3080,alive:true}];const flag={x:3080,y:350,w:24,h:120};function rects(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function reset(){player.x=80;player.y=380;player.vx=0;player.vy=0;player.hearts=3;player.stars=0;player.invincible=0;stars.forEach(s=>s.taken=false);enemies.forEach(e=>e.alive=true);gameWon=false;gameOver=false}function update(){if(gameWon||gameOver)return;if(keys.ArrowLeft||keys.a)player.vx-=player.speed;if(keys.ArrowRight||keys.d)player.vx+=player.speed;player.vx*=.86;player.vx=Math.max(-player.maxSpeed,Math.min(player.maxSpeed,player.vx));player.vy+=.75;player.x+=player.vx;for(const p of platforms){if(player.x+player.w>p.x&&player.x<p.x+p.w&&player.y+player.h<=p.y&&player.y+player.h+player.vy>=p.y){player.y=p.y-player.h;player.vy=0;player.onGround=true}}player.y+=player.vy;player.onGround=false;for(const p of platforms){if(player.x+player.w>p.x&&player.x<p.x+p.w&&player.y+player.h>=p.y&&player.y+player.h<=p.y+18&&player.vy>=0){player.y=p.y-player.h;player.vy=0;player.onGround=true}}if(player.y>620){player.hearts--;player.x=Math.max(40,player.x-160);player.y=300;player.vx=0;player.vy=0;player.invincible=90;if(player.hearts<=0)gameOver=true}player.x=Math.max(0,Math.min(world.width-player.w,player.x));if(player.invincible>0)player.invincible--;for(const s of stars){const box={x:s.x-s.r,y:s.y-s.r,w:s.r*2,h:s.r*2};if(!s.taken&&rects(player,box)){s.taken=true;player.stars++}}for(const e of enemies){if(!e.alive)continue;e.x+=e.vx;if(e.x<e.min||e.x>e.max)e.vx*=-1;if(rects(player,e)){const pb=player.y+player.h;if(player.vy>0&&pb-e.y<22){e.alive=false;player.vy=-10}else if(player.invincible<=0){player.hearts--;player.invincible=90;player.vx=player.x<e.x?-8:8;player.vy=-7;if(player.hearts<=0)gameOver=true}}}if(rects(player,flag)&&player.stars===stars.length)gameWon=true;cameraX=Math.max(0,Math.min(world.width-canvas.width,player.x-canvas.width*.35))}function jump(){if(player.onGround&&!gameWon&&!gameOver){player.vy=-player.jump;player.onGround=false}else if(gameWon||gameOver)reset()}window.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' '){e.preventDefault();jump()}});window.addEventListener('keyup',e=>keys[e.key]=false);function bindHold(id,key){const el=document.getElementById(id);const down=e=>{e.preventDefault();keys[key]=true};const up=e=>{e.preventDefault();keys[key]=false};el.addEventListener('pointerdown',down);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('pointerleave',up)}bindHold('left','ArrowLeft');bindHold('right','ArrowRight');document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});function drawStar(x,y,r){ctx.save();ctx.translate(x,y);ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2===0?r:r*.45;ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}ctx.closePath();ctx.fillStyle='#facc15';ctx.fill();ctx.strokeStyle='#f59e0b';ctx.lineWidth=3;ctx.stroke();ctx.restore()}function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='rgba(255,255,255,.85)';for(let i=0;i<10;i++){const x=(i*370-cameraX*.25)%3600,y=70+i%3*55;ctx.beginPath();ctx.arc(x,y,28,0,Math.PI*2);ctx.arc(x+30,y+5,22,0,Math.PI*2);ctx.arc(x-30,y+8,20,0,Math.PI*2);ctx.fill()}ctx.save();ctx.translate(-cameraX,0);ctx.fillStyle='#86efac';for(let x=0;x<world.width;x+=240){ctx.beginPath();ctx.moveTo(x,470);ctx.quadraticCurveTo(x+120,300,x+240,470);ctx.fill()}for(const p of platforms){ctx.fillStyle='#8b5a2b';ctx.fillRect(p.x,p.y,p.w,p.h);ctx.fillStyle='#22c55e';ctx.fillRect(p.x,p.y,p.w,14);ctx.fillStyle='#16a34a';for(let xx=p.x;xx<p.x+p.w;xx+=28)ctx.fillRect(xx,p.y+10,14,8)}for(const s of stars)if(!s.taken)drawStar(s.x,s.y,s.r);for(const e of enemies){if(!e.alive)continue;ctx.fillStyle='#22c55e';ctx.beginPath();ctx.ellipse(e.x+e.w/2,e.y+e.h/2,e.w/2,e.h/2,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='white';ctx.beginPath();ctx.arc(e.x+15,e.y+15,7,0,Math.PI*2);ctx.arc(e.x+33,e.y+15,7,0,Math.PI*2);ctx.fill();ctx.fillStyle='#111827';ctx.beginPath();ctx.arc(e.x+17,e.y+16,3,0,Math.PI*2);ctx.arc(e.x+31,e.y+16,3,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#6b7280';ctx.fillRect(flag.x,flag.y,flag.w,flag.h);ctx.fillStyle=player.stars===stars.length?'#ef4444':'#94a3b8';ctx.beginPath();ctx.moveTo(flag.x+flag.w,flag.y);ctx.lineTo(flag.x+95,flag.y+30);ctx.lineTo(flag.x+flag.w,flag.y+60);ctx.closePath();ctx.fill();if(player.invincible%10<5){ctx.fillStyle='#2563eb';ctx.fillRect(player.x,player.y+18,player.w,40);ctx.fillStyle='#f4c89d';ctx.beginPath();ctx.arc(player.x+21,player.y+16,18,0,Math.PI*2);ctx.fill();ctx.fillStyle='#7c2d12';ctx.fillRect(player.x+5,player.y,32,9);ctx.fillStyle='#111827';ctx.fillRect(player.x+12,player.y+13,4,5);ctx.fillRect(player.x+26,player.y+13,4,5);drawStar(player.x+21,player.y+38,7)}ctx.restore();ctx.fillStyle='rgba(15,23,42,.85)';ctx.fillRect(18,18,280,58);ctx.fillStyle='white';ctx.font='bold 24px system-ui';ctx.fillText('❤️ '+player.hearts+'   ⭐ '+player.stars+'/'+stars.length,32,55);if(player.stars<stars.length&&player.x>2950){ctx.fillStyle='rgba(15,23,42,.8)';ctx.fillRect(540,90,380,50);ctx.fillStyle='white';ctx.font='bold 20px system-ui';ctx.fillText('별을 전부 모아야 깃발이 열려!',565,122)}if(gameWon||gameOver){ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='white';ctx.textAlign='center';ctx.font='bold 54px system-ui';ctx.fillText(gameWon?'스테이지 클리어!':'게임 오버',canvas.width/2,235);ctx.font='bold 24px system-ui';ctx.fillText(gameWon?'무지개 스타를 되찾았다!':'다시 도전해 보자!',canvas.width/2,285);ctx.font='20px system-ui';ctx.fillText('점프 버튼을 누르면 다시 시작',canvas.width/2,330);ctx.textAlign='left'}}function loop(){update();draw();requestAnimationFrame(loop)}loop();
</script>
</body>
</html>
